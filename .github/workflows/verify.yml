name: Kretov Matrix Verification & 3D Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest plotly

      - name: Run Exact Combinatorial Audit
        run: python kretov_exact_combinatorics.py

      - name: Verify Delta(27) Group Isomorphism
        run: python kretov_delta27_isomorphism.py

      - name: Run Mathematical Invariants Verification
        run: pytest -v test_invariants.py

      - name: Generate Interactive 3D Model
        run: |
          mkdir -p public
          python kretov_interactive_3d.py
          cp kretov_matrix_3d_interactive.html public/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
