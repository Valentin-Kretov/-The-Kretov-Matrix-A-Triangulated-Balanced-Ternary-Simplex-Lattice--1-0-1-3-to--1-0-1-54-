name: Kretov Matrix Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Run Exact Combinatorial Audit
        run: python kretov_exact_combinatorics.py

      - name: Verify Delta(27) Group Isomorphism
        run: python kretov_delta27_isomorphism.py

      - name: Run Mathematical Invariants Verification
        run: pytest -v test_invariants.py
